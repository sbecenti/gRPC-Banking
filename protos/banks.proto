syntax = "proto3";

service RPC {
    
    rpc MsgDelivery (Request) returns (Response);
}

message Request {

    string interface = 1;
    int32 money = 2;
    int32 id = 3;

    int32 logical_clock = 4;
    int32 customer_request_id = 5;
    int32 sender_id = 6;
}

message Response {

    string interface = 1;
    int32 balance = 2;
    string result = 3;
}